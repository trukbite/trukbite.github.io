<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trukbite Demo · Try it with sample trucks</title>
<meta name="description" content="Try Trukbite before it launches: a live map of sample San Antonio food trucks, menus with dish ratings, truck parks and events, follow and alerts.">
<meta property="og:title" content="Try the Trukbite demo">
<meta property="og:description" content="Tap around a live map of sample San Antonio food trucks. Follow one and see the alert you'd get when it pulls up.">
<meta property="og:image" content="https://trukbite.com/img/share.jpg">
<meta property="og:url" content="https://trukbite.com/demo/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FF6B1A">
<link rel="icon" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
  /* Same "Sizzle" palette as the app and the info page. Layout: list panel left, map right; on phones the map sits on top. */
  :root {
    --flame: #FF6B1A; --flame-dark: #C24A06; --mustard: #FFC83D; --charcoal: #1F1F24; --raised: #2A2A31;
    --cream: #FFF8F0; --sand: #F3EADF; --line: #EFE5D8; --green: #2BB673; --soft: #4A4A52; --muted: #6B6B73; --closed: #9A9AA3;
    --display: "Poppins", "Segoe UI", system-ui, sans-serif; --body: "DM Sans", "Segoe UI", system-ui, sans-serif;
    --bar: 40px; --head: 60px; --panel: 420px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--cream); color: var(--charcoal); font: 15px/1.5 var(--body); }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; }
  p { margin: 0; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }

  /* demo banner + header */
  .demo-bar { height: var(--bar); background: var(--charcoal); color: #fff; display: flex; align-items: center; justify-content: center; gap: 12px;
              padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); font-size: 14px; }
  .demo-bar .pill { background: var(--mustard); color: var(--charcoal); font-weight: 700; font-size: 12px; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; }
  .demo-bar a { color: var(--mustard); font-weight: 700; white-space: nowrap; }
  .demo-bar .long { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header { height: var(--head); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); background: #fff;
           padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .brand { display: flex; align-items: center; gap: 8px; font: 800 20px var(--display); text-decoration: none; margin-right: 12px; }
  .brand img { height: 28px; width: auto; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tab { border: 0; background: none; padding: 8px 12px; border-radius: 999px; font-weight: 700; color: var(--soft); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  .tab[aria-selected="true"] { background: var(--charcoal); color: #fff; }
  .badge { background: var(--flame); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: inline-grid; place-items: center; padding: 0 5px; }
  .head-cta { margin-left: auto; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 18px; border-radius: 999px; border: 0;
         font-weight: 700; text-decoration: none; }
  .btn-primary { background: var(--flame); color: #fff; }
  .btn-dark { background: var(--charcoal); color: #fff; }
  .btn-ghost { background: #fff; border: 1.5px solid var(--charcoal); }
  .btn-following { background: var(--sand); color: var(--charcoal); }

  /* app layout */
  .app { position: relative; display: grid; grid-template-columns: var(--panel) 1fr; height: calc(100% - var(--bar) - var(--head)); }
  .panel { overflow-y: auto; border-right: 1px solid var(--line); background: var(--cream); }
  .panel-inner { padding: 16px; display: grid; gap: 12px; }
  #map { height: 100%; background: #E8E4DC; }

  .clock { display: grid; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .clock-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .clock-top strong { font: 700 16px var(--display); }
  .clock-top span { color: var(--muted); font-size: 13px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button, .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--soft); }
  .seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--charcoal); border-color: var(--charcoal); color: #fff; }
  .search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #fff; padding: 0 14px; font: inherit; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chip { white-space: nowrap; }
  .label { font: 700 12px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

  .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%;
         background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .row:hover { border-color: #E2D2BD; }
  .avatar { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font: 800 16px var(--display); color: #fff; }
  .row .name { font-weight: 700; font-size: 16px; }
  .row .sub { color: var(--muted); font-size: 13px; }
  .row .match { font-size: 13px; color: var(--flame-dark); font-weight: 700; }
  .row .right { text-align: right; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
  .row.off { opacity: .65; }
  .status { font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--closed); flex: none; }
  .s-open { color: #1E8E58; } .s-open .dot { background: var(--green); }
  .s-soon { color: var(--flame-dark); } .s-soon .dot { background: var(--mustard); }
  .s-later { color: var(--soft); }
  .s-closed { color: var(--muted); }
  .star { color: #C98A00; font-weight: 700; }
  .empty { background: #fff; border: 1px dashed #E2D2BD; border-radius: 16px; padding: 20px; text-align: center; color: var(--soft); display: grid; gap: 8px; justify-items: center; }
  .note { font-size: 13px; color: var(--muted); }

  /* truck page */
  .detail { position: absolute; inset: 0 auto 0 0; width: var(--panel); background: var(--cream); overflow-y: auto; z-index: 500; border-right: 1px solid var(--line); }
  .cover { height: 120px; display: flex; align-items: flex-end; padding: 12px 16px; position: relative; }
  .back { position: absolute; top: 12px; left: 12px; border: 0; background: rgba(255,255,255,.92); border-radius: 999px; height: 36px; padding: 0 14px; font-weight: 700; }
  .detail-body { padding: 16px; display: grid; gap: 16px; }
  .detail h2 { font-size: 26px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
  .card h3 { font-size: 17px; }
  .cat { font: 700 12px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .dish { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .dish:first-of-type { border-top: 0; }
  .dish .dn { font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .dish .dd { color: var(--muted); font-size: 13px; }
  .dish .dp { font-weight: 700; font-variant-numeric: tabular-nums; }
  .dish.sold .dn, .dish.sold .dp { color: var(--closed); text-decoration: line-through; }
  .tagx { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--sand); color: var(--soft); text-decoration: none; }
  .tagx.top { background: var(--mustard); color: var(--charcoal); }
  .tagx.sold { background: var(--charcoal); color: #fff; }
  .week { display: grid; gap: 6px; }
  .day { display: grid; grid-template-columns: 44px 1fr; gap: 10px; font-size: 14px; padding: 6px 8px; border-radius: 10px; }
  .day.today { background: var(--sand); }
  .day b { font-size: 12px; letter-spacing: .06em; color: var(--muted); padding-top: 1px; }
  .review { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
  .review:first-of-type { border-top: 0; padding-top: 0; }
  .reply { background: var(--sand); border-radius: 10px; padding: 8px 10px; font-size: 14px; }

  /* owner demo */
  .owner { background: var(--charcoal); color: #fff; border-radius: 20px; padding: 18px; display: grid; gap: 14px; }
  .owner .note { color: #CFCBC4; }
  .owner .big { height: 64px; border-radius: 16px; border: 0; background: var(--flame); color: #fff; font: 800 20px var(--display); }
  .owner .big.close { background: var(--raised); border: 1px solid #44444D; }
  .owner .seg button { background: var(--raised); border-color: #44444D; color: #fff; }
  .owner .seg button[aria-pressed="true"] { background: var(--mustard); border-color: var(--mustard); color: var(--charcoal); }
  .owner-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--raised); border-radius: 12px; padding: 10px 12px; }
  .switch { width: 46px; height: 28px; border-radius: 14px; border: 0; background: #55555E; position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--mustard); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .owner select.until { width: 100%; height: 48px; border-radius: 12px; border: 1px solid #44444D; background: var(--raised); color: #fff; padding: 0 12px; font: 700 17px var(--body); }
  .owner input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid #44444D; background: var(--raised); color: #fff; padding: 0 12px; font: inherit; }
  .pro { background: var(--mustard); color: var(--charcoal); font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 1px 7px; border-radius: 999px; }
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat div { background: var(--raised); border-radius: 12px; padding: 10px; }
  .stat b { display: block; font: 800 22px var(--display); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: #CFCBC4; }
  .stat4 { grid-template-columns: 1fr 1fr; }
  .stat4 div { display: grid; gap: 2px; align-content: start; }
  .stat4 span { font-size: 13px; }
  .stat4 em { font-style: normal; font-size: 12px; color: #CFCBC4; }
  .chg { font-size: 12px; font-weight: 700; }
  .chg.up { color: #7FE0AE; } .chg.down { color: #FF9A62; }
  .owner.stats { gap: 12px; }
  .seg3 button { flex: 1; }
  .callout { background: #3A3020; border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
  .callout b { color: var(--mustard); font: 700 17px var(--display); }
  .callout span { color: #E8DFC8; font-size: 14px; }
  .ocard { background: var(--raised); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
  .between { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .gold { color: var(--mustard); } .warn { color: #FF9A62; }
  .track { height: 8px; border-radius: 4px; background: #3A3A42; overflow: hidden; }
  .fill { height: 100%; background: var(--flame); border-radius: 4px; }
  .bars, .bars-x { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; }
  .owner, .owner > * { min-width: 0; }
  .bars { height: 120px; align-items: end; }
  .bars i { background: var(--flame); border-radius: 3px 3px 0 0; min-height: 2px; }
  .bars-x span { font-size: 11px; color: #9A9AA3; white-space: nowrap; }
  .heat { grid-template-columns: 30px repeat(18, minmax(0, 1fr)); gap: 2px; }
  .heat i { aspect-ratio: 1; border-radius: 3px; }
  .heat .hd { font-size: 12px; color: #CFCBC4; }
  .heat .hh { font-size: 9px; color: #9A9AA3; white-space: nowrap; overflow: visible; min-width: 0; }
  .months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; height: 130px; text-align: center; }
  .months div { display: grid; gap: 4px; grid-template-rows: auto 1fr auto; }
  .months i { align-self: end; background: var(--mustard); border-radius: 4px 4px 0 0; }
  .months .gold { font-size: 12px; }

  /* map pins */
  .pin { width: 34px; height: 46px; background: url("../img/logo.png") center/contain no-repeat; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); transition: transform .15s; }
  .pin.later { filter: grayscale(1) opacity(.75) drop-shadow(0 3px 4px rgba(0,0,0,.25)); width: 28px; height: 38px; }
  .pin.mine { animation: pop .5s ease-out; }
  .pin.sel { transform: scale(1.25); }
  .park-pin { width: 36px; height: 36px; border-radius: 9px; background: var(--charcoal); border: 2px solid #fff; color: #fff; display: grid; place-items: center; font: 800 16px var(--display); box-shadow: 0 3px 6px rgba(0,0,0,.3); }
  .park-pin.none { background: #8A8A92; }
  .you { width: 18px; height: 18px; border-radius: 50%; background: #2F7DF6; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(47,125,246,.2); }
  @keyframes pop { 0% { transform: translateY(-30px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .leaflet-tooltip.tip { font: 700 13px var(--body); border-radius: 8px; padding: 3px 8px; }

  /* phone-style alerts */
  .toasts { position: fixed; top: calc(var(--bar) + var(--head) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 1000; display: grid; gap: 10px; width: min(360px, calc(100% - 32px)); }
  .toast { background: rgba(255,255,255,.97); backdrop-filter: blur(10px); border-radius: 18px; padding: 12px 14px; box-shadow: 0 12px 30px rgba(31,31,36,.22);
           display: grid; grid-template-columns: 36px 1fr; gap: 10px; text-align: left; border: 0; width: 100%; animation: drop .35s ease-out; }
  .toast img { width: 36px; height: 36px; border-radius: 9px; background: var(--cream); object-fit: contain; padding: 3px; }
  .toast .app-name { font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
  .toast .t { font-weight: 700; }
  .toast .b { font-size: 14px; color: var(--soft); }
  .toast.info { grid-template-columns: 1fr; background: var(--charcoal); color: #fff; }
  .toast.info .b { color: #E6E2DC; }
  @keyframes drop { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .toast, .pin.mine { animation: none; } }

  .cta { background: var(--flame); color: #fff; border-radius: 20px; padding: 18px; display: grid; gap: 10px; }
  .cta p { color: #FFE9DA; }
  .cta .btn { background: #fff; color: var(--charcoal); justify-self: start; }

  /* phones: map on top, list below, truck page full screen */
  @media (max-width: 820px) {
    html, body { height: auto; }
    .demo-bar .long { display: none; }
    .head-cta { display: none; }
    .brand span { display: none; }
    .brand { margin-right: 4px; }
    .tab { padding: 7px 9px; font-size: 14px; }
    .app { display: flex; flex-direction: column; height: auto; }
    #map { order: -1; height: 42vh; min-height: 260px; position: sticky; top: 0; z-index: 1; }
    .panel { border: 0; overflow: visible; position: relative; z-index: 2; border-radius: 20px 20px 0 0; margin-top: -16px; box-shadow: 0 -6px 16px rgba(31,31,36,.08); }
    .panel-inner { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
    .detail { position: fixed; inset: 0; width: auto; z-index: 900; border: 0; }
    .toasts { top: 12px; }
  }
</style>
</head>
<body>
  <div class="demo-bar" role="note">
    <span class="pill">DEMO</span>
    <span class="long">These are sample trucks, not real ones. Trukbite launches soon in San Antonio.</span>
    <a class="js-form" href="../#join">Join the waitlist</a>
  </div>
  <header>
    <a class="brand" href="../" title="About Trukbite"><img src="../img/logo.png" alt="" width="64" height="88"><span>Trukbite</span></a>
    <nav class="tabs" role="tablist" aria-label="Demo sections">
      <button class="tab" role="tab" data-view="map" aria-selected="true">Trucks</button>
      <button class="tab" role="tab" data-view="following" aria-selected="false">Following <span class="badge" id="b-follow" hidden></span></button>
      <button class="tab" role="tab" data-view="alerts" aria-selected="false">Alerts <span class="badge" id="b-alerts" hidden></span></button>
      <button class="tab" role="tab" data-view="owner" aria-selected="false">For trucks</button>
    </nav>
    <a class="btn btn-primary head-cta js-form" href="../#join">Join the waitlist</a>
  </header>

  <main class="app">
    <section class="panel" aria-label="Trucks"><div class="panel-inner" id="panel"></div></section>
    <div id="map" role="region" aria-label="Map of sample food trucks"></div>
    <section class="detail" id="detail" hidden aria-label="Truck page"></section>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<script src="trucks.js"></script>
<script>
(() => {
  const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScQ_4iG-bZqABSIbp7MR-Zg2ZMjoByy9kh-VnRaVbRbMi-r6Q/viewform';
  document.querySelectorAll('.js-form').forEach((a) => { a.href = FORM_URL; a.target = '_blank'; a.rel = 'noopener'; });

  const YOU = [29.4241, -98.4936]; // demo shopper stands downtown, by the Alamo
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const TIMES = [
    { id: 'morning', label: 'Sat morning', day: 6, min: 9 * 60 },
    { id: 'lunch', label: 'Fri lunch', day: 5, min: 12 * 60 + 30 },
    { id: 'dinner', label: 'Fri dinner', day: 5, min: 19 * 60 },
  ];
  const COLORS = ['#FF6B1A', '#1F1F24', '#C24A06', '#2BB673', '#7A4BD6', '#2F7DF6', '#D6336C', '#8A6D3B'];
  const CHIPS = ['Tacos', 'BBQ', 'Coffee', 'Breakfast', 'Desserts', 'Asian', 'Burgers', 'Seafood', 'Vegan', 'Wings', 'Pizza'];
  const REVIEWERS = ['Maria G.', 'Jake T.', 'Priya S.', 'Luis R.', 'Danielle W.', 'Marcus B.', 'Ana L.', 'Chris P.', 'Tasha M.', 'Kevin N.', 'Sofia C.', 'Ray D.'];
  const SPECIALS = ['Today only: free agua fresca with any plate', '$2 off your second order until close', 'Just added a new dish. Come try it first', 'Happy hour: half-price drinks for the next hour'];

  const hm = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const clock = (m) => { const h = Math.floor(m / 60) % 24, mm = m % 60, ap = h < 12 ? 'AM' : 'PM', h12 = h % 12 || 12; return mm ? `${h12}:${String(mm).padStart(2, '0')} ${ap}` : `${h12} ${ap}`; };
  const money = (c) => '$' + (c % 100 ? (c / 100).toFixed(2) : c / 100);
  const miles = (a, b) => { const R = 3959, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initials = (n) => n.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const color = (t) => COLORS[t.id % COLORS.length];

  // Stops become {place, at:[lat,lng], days, start, end} in minutes.
  const trucks = window.DEMO_TRUCKS.map((t) => {
    const stops = t.stops.map(([place, lat, lng, days, s, e]) => ({ place, at: [lat, lng], days, start: hm(s), end: hm(e) }));
    // Like the app's sample data: some lunch-only trucks also do a weekday dinner at their usual spot.
    const breakfast = t.cuisines.includes('Breakfast') || t.cuisines.includes('Coffee');
    for (let d = 0; d <= 4 && !breakfast; d++) {
      const h = (t.id * 37 + d * 11) % 100;
      if (h < 45 && !stops.some((s) => s.days.includes(d) && s.start >= 15 * 60))
        stops.push({ place: stops[0].place, at: stops[0].at, days: [d], start: 16 * 60 + (h % 4) * 30, end: 20 * 60 + 30 + (h % 3) * 30 });
    }
    const menu = t.menu.map(([cat, name, desc, price, tags, rating, count], i) => ({ cat, name, desc, price, tags, rating, count, i }));
    const rated = menu.filter((m) => m.rating && m.count >= 10).sort((a, b) => b.rating - a.rating || b.count - a.count);
    return { ...t, stops, menu, top: rated[0] ? rated[0].i : -1, soldOut: t.id % 4 === 0 ? menu.length - 1 : -1 };
  });

  const ME = { id: 0, name: 'Your Truck', cuisines: ['Tacos'], price: 1, rating: 5, reviews: 0, about: 'This is you! In the real app, this is your truck.',
    menu: [{ cat: 'Tacos', name: 'Your best taco', desc: '', price: 400, tags: [], rating: null, count: 0, i: 0 }, { cat: 'Tacos', name: 'Quesabirria (3)', desc: '', price: 1200, tags: [], rating: null, count: 0, i: 1 }, { cat: 'Drinks', name: 'Agua fresca', desc: '', price: 350, tags: ['vegan'], rating: null, count: 0, i: 2 }],
    stops: [{ place: 'Hemisfair lawn', at: [29.4206, -98.4856], days: [], start: 0, end: 0 }], top: -1, soldOut: -1, mine: true };

  // Sample truck parks and one sample event (truck parks & events, comp list #4).
  const PARKS = [
    { id: 'p1', name: 'Pearl Lawn Food Park', at: [29.4431, -98.4801], hours: 'Every day, 11 AM–10 PM' },
    { id: 'p2', name: 'Westside Market Food Park', at: [29.4228, -98.5432], hours: 'Tue–Sat, 11 AM–3 PM' },
    { id: 'p3', name: 'Commerce St Brewery Yard', at: [29.4182, -98.5361], hours: 'Fri–Sat evenings' },
  ];
  const EVENT = { name: 'Friday Night Food Truck Rally', where: 'Hemisfair lawn', when: 'Fri · 6–10 PM', about: 'Live music, games and a dozen trucks on the lawn.', lineup: [3, 9, 13, 21] };
  const PARK_MILES = 0.15;
  function atPark(park) {
    const here = all().map((t) => ({ t, st: statusOf(t) })).filter(({ t, st }) => st.kind !== 'closed' && miles(park.at, where(t, st).at) <= PARK_MILES);
    return { now: here.filter((x) => x.st.kind === 'open'), later: here.filter((x) => x.st.kind !== 'open') };
  }

  const params = new URLSearchParams(location.search);
  const realHour = new Date().getHours();
  const state = {
    view: 'map', time: TIMES.find((t) => t.id === params.get('time')) || (realHour < 11 ? TIMES[0] : realHour < 16 ? TIMES[1] : TIMES[2]),
    q: '', chip: 'open', following: new Set(), parksFollowed: new Set(), going: false, alerts: [], unread: 0, open: null, forced: new Map(), surprised: new Set(),
    owner: { open: false, until: 21 * 60, sold: new Set(), special: '', followers: 128, sent: 0, statSec: 'overview', statDays: 7 },
  };

  // ---- status at the demo time ----
  function statusOf(t) {
    const { day, min } = state.time;
    if (t.mine) return state.owner.open ? { kind: 'open', until: state.owner.until, stop: t.stops[0] } : { kind: 'closed' };
    const f = state.forced.get(t.id);
    if (f) return f;
    const today = t.stops.filter((s) => s.days.includes(day)).sort((a, b) => a.start - b.start);
    const now = today.find((s) => s.start <= min && min < s.end);
    if (now) return { kind: 'open', until: now.end, stop: now };
    const next = today.find((s) => s.start > min);
    if (next) return { kind: next.start - min <= 60 ? 'soon' : 'later', stop: next };
    return { kind: 'closed' };
  }
  const where = (t, st) => (st.stop || t.stops[0]);
  function statusLine(st) {
    if (st.kind === 'open') return `<span class="status s-open"><span class="dot"></span>Open · until ${clock(st.until)}</span>`;
    if (st.kind === 'soon') return `<span class="status s-soon"><span class="dot"></span>Opening soon · ${clock(st.stop.start)}</span>`;
    if (st.kind === 'later') return `<span class="status s-later"><span class="dot"></span>Later today · ${clock(st.stop.start)}</span>`;
    return `<span class="status s-closed"><span class="dot"></span>Not out today</span>`;
  }
  const all = () => (state.owner.open ? [ME, ...trucks] : trucks);

  // ---- map ----
  const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([29.47, -98.52], 11);
  // Free OpenStreetMap map from OpenFreeMap (no key, no account).
  L.maplibreGL({ style: 'https://tiles.openfreemap.org/styles/liberty',
    attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors' }).addTo(map);
  L.marker(YOU, { icon: L.divIcon({ className: '', html: '<div class="you"></div>', iconSize: [18, 18] }), keyboard: false, interactive: false }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  const markers = new Map();

  function matches(t) {
    const q = state.q.trim().toLowerCase();
    if (state.chip && state.chip !== 'open' && !t.cuisines.includes(state.chip)) return null;
    if (!q) return { dish: null };
    // Always look for a matching dish, even when the truck's name or cuisine matches too.
    const dish = t.menu.filter((m) => m.name.toLowerCase().includes(q)).sort((a, b) => (b.rating || 0) - (a.rating || 0))[0] || null;
    if (dish || t.name.toLowerCase().includes(q) || t.cuisines.some((c) => c.toLowerCase().includes(q))) return { dish };
    return null;
  }
  function visible() {
    return all().map((t) => ({ t, st: statusOf(t), m: matches(t) })).filter((x) => x.m)
      .map((x) => ({ ...x, mi: miles(YOU, where(x.t, x.st).at) }));
  }

  function drawMap() {
    layer.clearLayers(); markers.clear();
    for (const { t, st } of visible()) {
      if (st.kind === 'closed') continue;
      if (state.chip === 'open' && st.kind !== 'open') continue;
      const cls = st.kind === 'open' ? '' : 'later';
      const icon = L.divIcon({ className: '', html: `<div class="pin ${cls} ${t.mine ? 'mine' : ''} ${state.open === t.id ? 'sel' : ''}"></div>`,
        iconSize: st.kind === 'open' ? [34, 46] : [28, 38], iconAnchor: st.kind === 'open' ? [17, 44] : [14, 36] });
      const mk = L.marker(where(t, st).at, { icon, title: t.name, zIndexOffset: st.kind === 'open' ? 500 : 0 })
        .bindTooltip(esc(t.name), { direction: 'top', offset: [0, -40], className: 'tip' })
        .on('click', () => openTruck(t.id));
      mk.addTo(layer); markers.set(t.id, mk);
    }
    for (const park of PARKS) {
      const n = atPark(park).now.length;
      const icon = L.divIcon({ className: '', html: `<div class="park-pin ${n ? '' : 'none'}">${n || 'P'}</div>`, iconSize: [36, 36], iconAnchor: [18, 36] });
      L.marker(park.at, { icon, title: park.name, zIndexOffset: 800 }).bindTooltip(esc(park.name), { direction: 'top', offset: [0, -36], className: 'tip' })
        .on('click', () => openPark(park.id)).addTo(layer);
    }
  }

  // ---- panel views ----
  const panel = document.getElementById('panel');

  function clockCard() {
    return `<div class="clock"><div class="clock-top"><strong>${DAY_NAMES[state.time.day]}, ${clock(state.time.min)}</strong><span>Demo time</span></div>
      <div class="seg" role="group" aria-label="Pick a demo time">${TIMES.map((t) => `<button data-time="${t.id}" aria-pressed="${t === state.time}">${t.label}</button>`).join('')}</div>
      <p class="note">Trucks open and close on their real schedules. Pick a time to see who's out.</p></div>`;
  }

  function row({ t, st, m, mi }) {
    const dish = m && m.dish;
    return `<button class="row ${st.kind === 'closed' ? 'off' : ''}" data-truck="${t.id}">
      <span class="avatar" style="background:${t.mine ? 'var(--flame)' : color(t)}">${t.mine ? 'YOU' : initials(t.name)}</span>
      <span style="min-width:0"><span class="name">${esc(t.name)}</span><br>

        <span class="sub">${esc(where(t, st).place)}</span>

      <span class="right"><span class="star">★ ${t.rating}</span><span>${mi.toFixed(1)} mi</span><span>${'$'.repeat(t.price)}</span></span></button>`;
  }

  function listView() {
    const rows = visible().sort((a, b) => a.mi - b.mi);
    const open = rows.filter((r) => r.st.kind === 'open');
    const later = rows.filter((r) => r.st.kind === 'soon' || r.st.kind === 'later').sort((a, b) => a.st.stop.start - b.st.stop.start);
    const off = rows.filter((r) => r.st.kind === 'closed');
    const showLater = state.chip !== 'open';
    let html = clockCard() + `
      <input class="search" id="q" type="search" placeholder="Search a truck, cuisine or dish (try &quot;brisket&quot;)" value="${esc(state.q)}" aria-label="Search trucks, cuisines or dishes">
      <div class="chips" role="group" aria-label="Filters">
        <button class="chip" data-chip="open" aria-pressed="${state.chip === 'open'}">Open now</button>
        <button class="chip" data-chip="" aria-pressed="${state.chip === ''}">All</button>
        ${CHIPS.map((c) => `<button class="chip" data-chip="${c}" aria-pressed="${state.chip === c}">${c}</button>`).join('')}
      </div>`;
    if (!state.q) {
      html += `<div class="label">Truck parks &amp; events</div>` + PARKS.map((park) => {
        const { now, later } = atPark(park);
        return `<button class="row" data-park="${park.id}"><span class="avatar" style="background:${now.length ? 'var(--charcoal)' : '#8A8A92'};border-radius:10px">${now.length || 'P'}</span>
          <span style="min-width:0"><span class="name">${esc(park.name)}</span><br><span class="sub">${now.length ? `${now.length} ${now.length === 1 ? 'truck' : 'trucks'} here now` : 'No trucks right now'}${later.length ? ` · ${later.length} later today` : ''}</span></span><span class="right">${miles(YOU, park.at).toFixed(1)} mi</span></button>`;
      }).join('') + `<button class="row" data-event="1"><span class="avatar" style="background:var(--flame);border-radius:10px">★</span>
        <span style="min-width:0"><span class="name">${esc(EVENT.name)}</span><br><span class="sub">${esc(EVENT.when)} · ${esc(EVENT.where)} · ${EVENT.lineup.length} trucks going</span></span><span class="right">Event</span></button>
        <button class="row" data-suggest="1" style="border-style:dashed"><span class="avatar" style="background:var(--sand);color:var(--charcoal);border-radius:10px">+</span>
        <span style="min-width:0"><span class="name">Know a spot we're missing?</span><br><span class="sub">Suggest a truck park or event</span></span><span class="right">Suggest</span></button>`;
    }
    html += `<div class="label">Open now · ${open.length}</div>`;
    html += open.length ? open.map(row).join('') : `<div class="empty">No trucks open for this search right now.<span class="note">Try "All", or pick another demo time.</span></div>`;
    if (showLater && later.length) html += `<div class="label">Opening soon &amp; later today · ${later.length}</div>` + later.map(row).join('');
    if (state.q && off.length) html += `<div class="label">Not out today</div>` + off.map(row).join('');
    html += `<p class="note">Distances are from downtown San Antonio. In the app, they're from where you are.</p>` + ctaCard();
    return html;
  }

  function followingView() {
    const list = all().filter((t) => state.following.has(t.id)).map((t) => { const st = statusOf(t); return { t, st, m: { dish: null }, mi: miles(YOU, where(t, st).at) }; });
    const parks = PARKS.filter((park) => state.parksFollowed.has(park.id));
    let extra = '';
    if (state.going) extra += `<div class="label">Events you're going to</div><button class="row" data-event="1"><span class="avatar" style="background:var(--flame);border-radius:10px">★</span>
      <span style="min-width:0"><span class="name">${esc(EVENT.name)}</span><br><span class="sub">${esc(EVENT.when)} · ${EVENT.lineup.length} trucks</span></span><span class="right">Going</span></button>`;
    if (parks.length) extra += `<div class="label">Truck parks</div>` + parks.map((park) => {
      const { now, later } = atPark(park);
      return `<button class="row" data-park="${park.id}"><span class="avatar" style="background:${now.length ? 'var(--charcoal)' : '#8A8A92'};border-radius:10px">${now.length || 'P'}</span>
        <span style="min-width:0"><span class="name">${esc(park.name)}</span><br><span class="sub">${now.length ? `${now.length} here now` : later.length ? `${later.length} coming later today` : 'No trucks right now'}</span></span><span class="right">${miles(YOU, park.at).toFixed(1)} mi</span></button>`;
    }).join('');
    if (!list.length && extra) return extra;
    if (!list.length) return `<div class="empty"><h3>Follow your favorite trucks</h3><p>Open any truck and tap <b>Follow</b>. You'll see where it is right now, and get an alert when it pulls up.</p>
      <button class="btn btn-primary" data-view="map">Find a truck</button><span class="note">New to Trukbite? <a href="../how-to/#customers">Watch how it works</a> in 6 short videos.</span></div>`;
    return `<div class="label">Following · ${list.length}</div>` + list.map(row).join('') + `<p class="note">In the app you choose, per truck: alerts for everything, only when they open, or off.</p>` + extra;
  }

  function alertsView() {
    if (!state.alerts.length) return `<div class="empty"><h3>No alerts yet</h3><p>Follow a truck and we'll show you the alert you'd get on your phone when it pulls up.</p>
      <button class="btn btn-primary" data-view="map">Find a truck</button></div>`;
    return `<div class="label">Alerts</div>` + state.alerts.map((a) => a.park || a.event ? `<button class="row" ${a.park ? `data-park="${a.park}"` : 'data-event="1"'}>
      <span class="avatar" style="background:${a.park ? 'var(--charcoal)' : 'var(--flame)'};border-radius:10px">${a.park ? 'P' : '★'}</span>
      <span style="min-width:0"><span class="name">${esc(a.title)}</span><br><span class="sub">${esc(a.body)}</span></span><span class="right">${a.when}</span></button>` : `<button class="row" data-truck="${a.id}">
      <span class="avatar" style="background:${a.id === 0 ? 'var(--flame)' : color(trucks.find((t) => t.id === a.id))}">${a.id === 0 ? 'YOU' : initials(a.name)}</span>
      <span style="min-width:0"><span class="name">${esc(a.title)}</span><br><span class="sub">${esc(a.body)}</span></span><span class="right">${a.when}</span></button>`).join('');
  }

  // Closing times like the app's scrolling picker: every 15 min from 15 min to 16 hours after the demo time.
  function closeOptions() {
    const first = Math.ceil((state.time.min + 15) / 15) * 15;
    const out = [];
    for (let m = first; m <= state.time.min + 16 * 60; m += 15) out.push(m);
    return out;
  }
  const closeLabel = (m) => (m >= 24 * 60 ? `${clock(m)} · after midnight` : clock(m));

  function ownerView() {
    const o = state.owner;
    const opts = closeOptions();
    if (!opts.includes(o.until)) o.until = opts.find((m) => m >= 21 * 60) ?? opts[opts.length - 1];
    const items = ME.menu.map((m) => `<div class="owner-row"><span>${esc(m.name)}<br><span class="note">${money(m.price)}</span></span>
      <span style="display:flex;gap:8px;align-items:center"><span class="note">Sold out</span><button class="switch" role="switch" data-sold="${m.i}" aria-checked="${o.sold.has(m.i)}" aria-label="${esc(m.name)} sold out"></button></span></div>`).join('');
    return `<div class="owner">
      <div><span class="note">MY TRUCK · DEMO</span><h2 style="font-size:24px;margin-top:4px">Your Truck</h2></div>
      ${o.open
        ? `<div class="owner-row" style="background:#1E3A2C"><span class="status s-open" style="color:#7FE0AE"><span class="dot"></span>Open at ${esc(ME.stops[0].place)} · until ${clock(o.until)}</span></div>
           <p class="note">You're on the map, and ${o.followers} followers just got "Your Truck just pulled up". We'll ask "Still open?" 15 minutes before ${clock(o.until)}, then close you automatically.</p>
           <button class="big close" data-owner="close">Close for today</button>`
        : `<p class="note">You just parked at ${esc(ME.stops[0].place)}. Pick a closing time, then tap Open here.</p>
           <label class="note" for="until">Open until</label>
           <select id="until" class="until">${closeOptions().map((m) => `<option value="${m}"${m === o.until ? ' selected' : ''}>${closeLabel(m)}</option>`).join('')}</select>
           <button class="big" data-owner="open">Open here</button>`}
      <div class="owner-row" style="align-items:flex-start">
        <span>Your truck page<br><span class="note">trukbite.com/t/your-truck · menu, schedule and where you are, for your Instagram bio</span></span>
        <button class="btn btn-primary" data-owner="share" style="height:36px;padding:0 14px;flex:none">Share</button>
      </div>
      <div class="owner-row" style="align-items:flex-start">
        <span>Schedule for your website<br><span class="note">Paste one bit of code on your own website: it shows this week's stops and a Follow on Trukbite button</span></span>
        <button class="btn btn-primary" data-owner="widget" style="height:36px;padding:0 14px;flex:none">Get code</button>
      </div>
      <div class="owner-row" style="align-items:flex-start">
        <span>Google Calendar<br><span class="note">Plan in your calendar: every event becomes a stop on your schedule, and changes follow on their own</span></span>
        <button class="btn btn-primary" data-owner="calendar" style="height:36px;padding:0 14px;flex:none">Connect</button>
      </div>
      <div class="owner-row" style="align-items:flex-start">
        <span>How-to videos<br><span class="note">Everything your truck can do in Trukbite, in 8 short videos (and 6 for your customers)</span></span>
        <a class="btn btn-primary" href="../how-to/#owners" style="height:36px;padding:0 14px;flex:none">Watch</a>
      </div>
      <div class="owner-row" style="align-items:flex-start">
        <span>Plan &amp; billing<br><span class="note">Founding truck · Pro free during the beta. Go Pro, switch monthly/yearly or cancel anytime</span></span>
        <button class="btn btn-primary" data-owner="billing" style="height:36px;padding:0 14px;flex:none">See plans</button>
      </div>
      <div class="label" style="color:#CFCBC4">Menu · tap when you run out</div>
      ${items}
      <div class="label" style="color:#CFCBC4">Specials <span class="pro">PRO</span></div>
      <input id="special" maxlength="140" placeholder="e.g. $2 off quesabirria until 8" value="${esc(o.special)}" aria-label="Special for your followers">
      <button class="btn btn-primary" data-owner="special" style="justify-self:start">Send to followers</button>
      <div class="label" style="color:#CFCBC4">Catering requests <span class="pro">PRO</span></div>
      <div class="ocard">
        <div class="between"><b>Sat, Nov 14 · 11:30 AM</b><span class="pro">NEW</span></div>
        <span>60 people · Office lunch</span>
        <span class="note">📍 Medical Center office park · "Two hours, a few vegetarian options please"</span>
        <span><b>Jessica R.</b> <span class="note">· (210) 555-0147</span></span>
        <div style="display:flex;gap:8px"><button class="btn btn-primary" data-owner="call" style="flex:1;height:36px">Call</button><button class="btn btn-primary" data-owner="call" style="flex:1;height:36px">Text</button></div>
        <span class="note">Customers send these from your truck page. Mark each one Contacted, Booked or Declined.</span>
      </div>
    </div>` + statsBlock() + `<div class="cta"><h3>Run a truck in San Antonio?</h3><p>The first 20 trucks get Pro free for 6 months after launch, then 50% off for life.</p>
      <a class="btn js-form" href="${FORM_URL}" target="_blank" rel="noopener">Claim a founding spot</a></div>`;
  }

  // ---- owner stats (sample numbers, same sections as the app's Stats screen) ----
  const STAT_SECS = [['overview', 'Overview'], ['spots', 'Best spots'], ['times', 'Days & times'], ['alerts', 'Alerts'], ['menu', 'Menu & reviews'], ['areas', 'Where from']];
  const SCALE = { 7: 1, 30: 4.2, 90: 12.4 };
  const n = (v) => Math.round(v).toLocaleString('en-US');
  const up = (pct) => `<span class="chg ${pct >= 0 ? 'up' : 'down'}">${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct)}%</span>`;
  const callout = (title, body) => `<div class="callout"><b>${title}</b><span>${body}</span></div>`;
  const bar = (frac) => `<div class="track"><div class="fill" style="width:${Math.max(3, frac * 100)}%"></div></div>`;
  const WEEKDAY_W = [0.75, 0.55, 0.7, 0.8, 0.9, 1.35, 1.2]; // Sun..Sat

  function statsOverview(d, f) {
    const days = Array.from({ length: d }, (_, i) => {
      const dow = (((5 - (d - 1 - i)) % 7) + 7) % 7; // the last bar is today (Friday)
      return { dow, v: Math.round(150 * WEEKDAY_W[dow] * (0.85 + 0.3 * Math.abs(Math.sin(i * 1.7))) * (1 + i / (d * 3))) };
    });
    const max = Math.max(...days.map((x) => x.v));
    const every = d === 7 ? 1 : d === 30 ? 7 : 21;
    const lbl = (x, i) => ((d - 1 - i) % every === 0 ? DAYS[x.dow] : '');
    return `<div class="stat stat4">
        <div><span>Followers</span><b>${n(state.owner.followers)}</b><em>+${{ 7: 14, 30: 38, 90: 71 }[d]} new</em>${up(d === 90 ? 41 : 27)}</div>
        <div><span>Profile views</span><b>${n(1046 * f)}</b>${up(d === 30 ? 12 : 18)}</div>
        <div><span>Direction taps</span><b>${n(213 * f)}</b>${up(22)}</div>
        <div><span>Calls &amp; link taps</span><b>${n(41 * f)}</b>${up(d === 7 ? -5 : 9)}</div>
      </div>
      <p class="note">Arrows compare with the ${d} days before. Taps by you and your staff aren't counted.</p>
      <div class="ocard"><b>Profile views by day</b>
        <div class="bars" style="--n:${d}">${days.map((x) => `<i style="height:${(x.v / max) * 100}%" title="${n(x.v)} views"></i>`).join('')}</div>
        <div class="bars-x" style="--n:${d}">${days.map((x, i) => `<span>${lbl(x, i)}</span>`).join('')}</div></div>`;
  }

  function statsSpots(f) {
    const spots = [['Hemisfair lawn', 9.4, 6, 31], ['Pearl Park lawn', 6.1, 4, 22], ['Medical Center Lot C', 4.2, 5, 15], ['Brewery on Commerce', 3.8, 2, 9]];
    const max = spots[0][1];
    return callout('Best spot: Hemisfair lawn', '9.4 direction taps per hour open, 1.9× your other spots.') +
      spots.map(([s, rate, visits, hrs], i) => `<div class="ocard"><div class="between"><b>${i + 1}. ${s}</b><b class="gold">${rate}/hr</b></div>${bar(rate / max)}
        <span class="note">${n(visits * f)} visits · ${n(hrs * f)} hrs open · ${n(rate * hrs * f * 4.6)} views · ${n(rate * hrs * f)} direction taps</span></div>`).join('') +
      `<p class="note">Ranked by direction taps per hour you were open there, so long and short visits compare fairly.</p>`;
  }

  function statsTimes() {
    const hours = Array.from({ length: 18 }, (_, i) => i + 6); // 6 AM to 11 PM
    const score = (dow, h) => {
      const lunch = Math.exp(-((h - 12) ** 2) / 2), dinner = Math.exp(-((h - 19) ** 2) / 2.5) * (dow >= 5 ? 1.5 : 0.8), morning = Math.exp(-((h - 8) ** 2) / 1.5) * 0.35;
      return WEEKDAY_W[dow] * (lunch + dinner + morning);
    };
    const max = score(5, 19);
    const order = [1, 2, 3, 4, 5, 6, 0];
    const cell = (dow, h) => { const v = Math.min(1, score(dow, h) / max);
      return `<i style="background:${v < 0.06 ? '#2E2E35' : `rgba(255,107,26,${(0.15 + 0.85 * v).toFixed(2)})`}" title="${DAYS[dow]} ${clock(h * 60)}"></i>`; };
    return callout('Busiest: Fri 6 PM–8 PM', 'When the most people look you up and tap Directions.') +
      `<div class="ocard heat">${order.map((dow) => `<span class="hd">${DAYS[dow]}</span>${hours.map((h) => cell(dow, h)).join('')}`).join('')}
        <span class="hd"></span>${hours.map((h) => `<span class="hh">${h % 3 === 0 ? clock(h * 60).replace(' ', '') : ''}</span>`).join('')}</div>
      <p class="note">Darker = more interest. Direction taps count extra, since those people are on their way.</p>`;
  }

  function statsAlerts(f) {
    const sends = [['Just pulled up', 'Fri, Oct 16 · 11:02 AM', 124, 71, 22], ['Special', 'Thu, Oct 15 · 5:40 PM', 121, 64, 17], ['Just pulled up', 'Wed, Oct 14 · 11:05 AM', 119, 58, 15],
      ['Next week posted', 'Sun, Oct 11 · 7:15 PM', 115, 49, 0], ['Moved', 'Sat, Oct 10 · 2:20 PM', 112, 61, 12]];
    const sum = (k) => Math.round(sends.reduce((a, s) => a + s[k], 0) * f);
    const reached = sum(2), opened = sum(3), dirs = sum(4);
    return callout(`${n(dirs)} followers headed your way`, `Your alerts reached ${n(reached)} followers. ${Math.round((opened / reached) * 100)}% opened them and ${Math.round((dirs / reached) * 100)}% tapped Directions within 2 hours.`) +
      sends.map(([kind, when, r, o, d]) => `<div class="ocard"><div class="between"><b>${kind}</b><span class="note">${when}</span></div>
        <span class="note">Reached ${r} · opened ${o} (${Math.round((o / r) * 100)}%) · directions ${d}</span></div>`).join('') +
      (f > 1 ? `<p class="note">Showing your 5 latest alerts.</p>` : '');
  }

  function statsMenu(f) {
    const g = Math.min(f, 2);
    const dishes = [['Quesabirria (3)', 4.9, 61], ['Your best taco', 4.7, 88], ['Agua fresca', 4.5, 12]];
    const months = [['May', 4.6], ['Jun', 4.7], ['Jul', 4.6], ['Aug', 4.8], ['Sep', 4.8], ['Oct', 4.9]];
    return callout('Top dish: Quesabirria (3)', `★ 4.9 from ${n(61 * g)} ratings.`) +
      `<div class="ocard"><b>Dish ratings</b>${dishes.map(([d, r, c]) => `<div class="between"><span>${d}</span><span class="gold">★ ${r} · ${n(c * g)} ratings</span></div>`).join('')}</div>
      <div class="ocard"><b>Sold out most often</b>${[['Quesabirria (3)', 4], ['Agua fresca', 2]].map(([d, c]) => `<div class="between"><span>${d}</span><span class="warn">${n(c * f)} times</span></div>`).join('')}
        <span class="note">Selling out often? Bring more of it.</span></div>
      <div class="ocard"><b>Stars by month</b><div class="months">${months.map(([m, a]) => `<div><span class="gold">${a}</span><i style="height:${(a - 4) * 100}%"></i><span class="note">${m}</span></div>`).join('')}</div>
        <span class="warn" style="font-weight:700">2 reviews need a reply ›</span></div>`;
  }

  function statsAreas(f) {
    const areas = [['Medical Center', 388, 84], ['Downtown', 312, 71], ['Southtown', 201, 46], ['Pearl', 184, 40], ['Alamo Heights', 121, 22], ['Stone Oak', 64, 9]];
    const max = areas[0][1] + areas[0][2];
    return callout('Most interest: Medical Center', "Worth a stop nearby if you don't park there already.") +
      `<div class="ocard">${areas.map(([a, v, d]) => `<div class="between"><span>${a}</span><span class="note">${n(v * f)} views · ${n(d * f)} directions</span></div>${bar((v + d) / max)}`).join('')}</div>
      <p class="note">From customers who share their location, rounded to about 1 km. Areas with fewer than 3 people aren't shown.</p>`;
  }

  function statsBlock() {
    const o = state.owner, d = o.statDays, f = SCALE[d];
    const body = { overview: () => statsOverview(d, f), spots: () => statsSpots(f), times: statsTimes, alerts: () => statsAlerts(f), menu: () => statsMenu(f), areas: () => statsAreas(f) }[o.statSec]();
    return `<div class="owner stats" id="stats">
      <div class="between"><h2 style="font-size:22px">Your stats</h2><span class="pro">PRO</span></div>
      <p class="note">Sample numbers for a busy taco truck. Real trucks see their own.</p>
      <div class="seg" role="group" aria-label="Stats section">${STAT_SECS.map(([k, l]) => `<button data-stat-sec="${k}" aria-pressed="${o.statSec === k}">${l}</button>`).join('')}</div>
      ${o.statSec === 'times' ? '' : `<div class="seg seg3" role="group" aria-label="Period">${[7, 30, 90].map((x) => `<button data-stat-days="${x}" aria-pressed="${d === x}">${x} days</button>`).join('')}</div>`}
      ${body}
    </div>`;
  }

  const ctaCard = () => `<div class="cta"><h3>Like what you see?</h3><p>Join the waitlist and we'll tell you the day Trukbite launches in San Antonio.</p>
    <a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Join the waitlist</a></div>`;

  function render() {
    const keepFocus = document.activeElement && document.activeElement.id === 'q';
    const pos = keepFocus ? document.activeElement.selectionStart : 0;
    panel.innerHTML = state.view === 'map' ? listView() : state.view === 'following' ? followingView() : state.view === 'alerts' ? alertsView() : ownerView();
    if (keepFocus) { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
    const bf = document.getElementById('b-follow'), ba = document.getElementById('b-alerts');
    bf.hidden = !state.following.size; bf.textContent = state.following.size;
    ba.hidden = !state.unread; ba.textContent = state.unread;
    drawMap();
    if (state.open !== null) renderTruck();
  }

  // ---- truck page ----
  const detail = document.getElementById('detail');
  const blockedWho = new Set(); // reviewers you blocked (demo: just hides them)
  function reviewsFor(t) {
    const dishes = t.menu.filter((m) => m.rating).sort((a, b) => b.rating - a.rating);
    const d1 = (dishes[0] || t.menu[0]).name, d2 = (dishes[1] || dishes[0] || t.menu[0]).name;
    const who = (k) => REVIEWERS[(t.id * 3 + k) % REVIEWERS.length];
    return [
      { who: who(0), stars: 5, text: `The ${d1.toLowerCase()} was unreal. Already planning my next visit.`, reply: 'Thank you! See you next time.' },
      { who: who(1), stars: 5, text: `I followed them so I'd stop missing them. Got the alert, walked over, and the ${d2.toLowerCase()} was worth it.` },
      { who: who(2), stars: 4, text: `Solid ${d1.toLowerCase()} and a friendly crew. The line moved fast.` },
    ];
  }
  function renderTruck() {
    const t = all().find((x) => x.id === state.open);
    if (!t) { closeTruck(); return; }
    const st = statusOf(t), spot = where(t, st), mi = miles(YOU, spot.at), following = state.following.has(t.id);
    const cats = [...new Set(t.menu.map((m) => m.cat))];
    const sold = (m) => (t.mine ? state.owner.sold.has(m.i) : st.kind === 'open' && m.i === t.soldOut);
    const menu = cats.map((c) => `<div class="cat">${esc(c)}</div>` + t.menu.filter((m) => m.cat === c).map((m) => `<div class="dish ${sold(m) ? 'sold' : ''}">
      <span class="dn">${esc(m.name)} ${m.i === t.top ? '<span class="tagx top">TOP DISH</span>' : ''} ${sold(m) ? '<span class="tagx sold">Sold out</span>' : ''}</span>
      <span class="dp">${money(m.price)}</span>
      <span class="dd">${m.rating ? `<span class="star">★ ${m.rating}</span> · ${m.count} ratings` : 'No ratings yet'}${m.desc ? ' · ' + esc(m.desc) : ''}${m.tags.length ? ' · ' + m.tags.map((x) => x.replace('_', '-')).join(', ') : ''}</span></div>`).join('')).join('');
    const week = DAYS.map((d, i) => {
      const s = t.stops.filter((x) => x.days.includes(i)).sort((a, b) => a.start - b.start);
      return `<div class="day ${i === state.time.day ? 'today' : ''}"><b>${d.toUpperCase()}</b><span>${s.length ? s.map((x) => `${clock(x.start)}–${clock(x.end)} · ${esc(x.place)}`).join('<br>') : '<span class="note">Day off</span>'}</span></div>`;
    }).join('');
    const reviews = t.mine ? '' : `<div class="card"><h3>Reviews · <span class="star">★ ${t.rating}</span> <span class="note">(${t.reviews})</span></h3>
      ${reviewsFor(t).filter((r) => !blockedWho.has(r.who)).map((r) => `<div class="review"><b>${esc(r.who)}</b> <span class="star">${'★'.repeat(r.stars)}</span><p>${esc(r.text)}</p>${r.reply ? `<div class="reply"><b>Reply from ${esc(t.name)}:</b> ${esc(r.reply)}</div>` : ''}<span class="note"><a href="#" data-rreport="${esc(r.who)}">Report</a> · <a href="#" data-rblock="${esc(r.who)}">Block</a></span></div>`).join('')}</div>`;
    detail.innerHTML = `<div class="cover" style="background:${t.mine ? 'var(--flame)' : color(t)}"><button class="back" data-close>← Back</button></div>
      <div class="detail-body">
        <div style="display:grid;gap:6px"><h2>${esc(t.name)}</h2>
          <span class="note">${t.cuisines.map(esc).join(' · ')} · ${'$'.repeat(t.price)} · <span class="star">★ ${t.rating}</span></span>
          ${statusLine(st)}<span class="note">${esc(spot.place)} · ${mi.toFixed(1)} mi from downtown</span></div>
        <p>${esc(t.about)}</p>
        <div class="actions">
          ${t.mine ? '' : `<button class="btn ${following ? 'btn-following' : 'btn-primary'}" data-follow="${t.id}" aria-pressed="${following}">${following ? '✓ Following' : 'Follow'}</button>`}
          <a class="btn btn-ghost" href="https://www.google.com/maps/dir/?api=1&destination=${spot.at[0]},${spot.at[1]}" target="_blank" rel="noopener">Directions</a>
        </div>
        ${!t.mine && !following ? `<p class="note">Tap Follow and watch for the alert.</p>` : ''}
        ${t.mine ? '' : cateringCard(t)}
        <div class="card"><h3>Menu</h3>${menu}</div>
        <div class="card"><h3>This week</h3><div class="week">${week}</div></div>
        ${reviews}
        ${ctaCard()}
      </div>`;
  }
  // Customer side of catering requests (Pro trucks in the real app; every sample truck here).
  function cateringCard(t) {
    if (state.cater !== t.id) {
      return `<div class="card"><h3>Request catering</h3><p class="note">Office lunch, party or wedding? Ask ${esc(t.name)} to cater it.</p>
        <button class="btn btn-ghost" data-cater="open" style="justify-self:start">Request catering</button></div>`;
    }
    return `<div class="card"><h3>Request catering</h3>
      <label class="note" for="c-date">Date</label><input id="c-date" class="search" type="date">
      <label class="note" for="c-people">How many people?</label><input id="c-people" class="search" type="number" min="1" placeholder="e.g. 60">
      <label class="note" for="c-where">Where?</label><input id="c-where" class="search" placeholder="Address or area">
      <label class="note" for="c-name">Your name and phone</label><input id="c-name" class="search" placeholder="Name · phone">
      <button class="btn btn-primary" data-cater="send" style="justify-self:start">Send request</button></div>`;
  }

  function openPark(id) {
    const park = PARKS.find((x) => x.id === id);
    const { now, later } = atPark(park);
    state.open = null; detail.hidden = false; detail.scrollTop = 0;
    const list = (xs) => xs.map(({ t, st }) => row({ t, st, m: { dish: null }, mi: miles(YOU, where(t, st).at) })).join('');
    detail.innerHTML = `<div class="cover" style="background:var(--charcoal)"><button class="back" data-close>← Back</button></div>
      <div class="detail-body"><div style="display:grid;gap:6px"><span class="note">TRUCK PARK · SAMPLE</span><h2>${esc(park.name)}</h2>
        <span class="note">Hours: ${esc(park.hours)} · ${miles(YOU, park.at).toFixed(1)} mi from downtown</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-ghost" href="https://www.google.com/maps/dir/?api=1&destination=${park.at[0]},${park.at[1]}" target="_blank" rel="noopener">Directions</a>
          <button class="btn ${state.parksFollowed.has(park.id) ? 'btn-following' : 'btn-primary'}" data-pfollow="${park.id}" aria-pressed="${state.parksFollowed.has(park.id)}">${state.parksFollowed.has(park.id) ? '♥ Following' : '♡ Follow'}</button></div>
        <span class="note">${state.parksFollowed.has(park.id) ? "We'll tell you at 4 PM who's here tonight, and when a new event is added here." : "Follow to get tonight's lineup at 4 PM on days trucks are here."}</span>
        <div class="label">Here now · ${now.length}</div>${now.length ? list(now) : '<p class="note">No trucks here at this demo time. Try another time.</p>'}
        ${later.length ? `<div class="label">Later today · ${later.length}</div>${list(later)}` : ''}
        <p class="note">In the app, every truck park gets a pin on the map with how many trucks are there, and trucks can pick the park when they add a stop.</p>
        <p class="note"><strong>Run this park?</strong> In the app, tap "Run this place? Claim it". Once we confirm it's yours, you can update its hours and details, add events that go live right away, and invite trucks.</p>
        ${ctaCard()}</div>`;
    map.flyTo(park.at, 15, { duration: .6 });
  }

  function openEvent() {
    state.open = null; detail.hidden = false; detail.scrollTop = 0;
    const lineup = EVENT.lineup.map((id) => trucks.find((t) => t.id === id)).filter(Boolean);
    detail.innerHTML = `<div class="cover" style="background:var(--flame)"><button class="back" data-close>← Back</button></div>
      <div class="detail-body"><div style="display:grid;gap:6px"><span class="note" style="color:var(--flame-dark);font-weight:700">${esc(EVENT.when.toUpperCase())}</span><h2>${esc(EVENT.name)}</h2>
        <span class="note">${esc(EVENT.where)} · sample event</span></div><p>${esc(EVENT.about)}</p>
        <button class="btn ${state.going ? 'btn-following' : 'btn-primary'}" style="justify-self:start" data-going="1" aria-pressed="${state.going}">${state.going ? '✓ I’m going' : 'I’m going'}</button>
        <span class="note">${47 + (state.going ? 1 : 0)} people going · ${state.going ? "We'll remind you that morning and tell you when more trucks join." : 'Get a reminder that morning.'}</span>
        <div class="label">Lineup · ${lineup.length}</div>${lineup.map((t) => { const st = statusOf(t); return row({ t, st, m: { dish: null }, mi: miles(YOU, where(t, st).at) }); }).join('')}
        <p class="note">Truck owners join an event with one tap in the app ("My truck will be there"), and it's added to their schedule. Organizers can also invite trucks: the truck gets an alert and taps Accept.</p>
        ${ctaCard()}</div>`;
  }

  function openTruck(id) {
    const first = state.open !== id;
    state.open = id; detail.hidden = false; renderTruck(); drawMap();
    if (first) detail.scrollTop = 0;
    const t = all().find((x) => x.id === id), st = statusOf(t);
    if (st.kind !== 'closed') map.flyTo(where(t, st).at, Math.max(map.getZoom(), 13), { duration: .6 });
  }
  function closeTruck() { state.open = null; detail.hidden = true; drawMap(); }

  // ---- alerts ----
  const toasts = document.getElementById('toasts');
  function toast({ title, body, id, info, onOpen }) {
    const el = document.createElement('button');
    el.className = 'toast' + (info ? ' info' : '');
    el.innerHTML = info ? `<span><span class="t">${esc(title)}</span><br><span class="b">${esc(body)}</span></span>`
      : `<img src="../img/logo.png" alt=""><span><span class="app-name"><span>TRUKBITE</span><span>now</span></span><span class="t">${esc(title)}</span><br><span class="b">${esc(body)}</span></span>`;
    el.addEventListener('click', () => { el.remove(); if (onOpen) onOpen(); else if (id !== undefined) openTruck(id); });
    toasts.prepend(el);
    setTimeout(() => el.remove(), 8000);
  }
  function pushAlert(id, title, body) {
    const t = all().find((x) => x.id === id);
    state.alerts.unshift({ id, name: t.name, title, body, when: 'now' });
    state.alerts.slice(1).forEach((a) => { if (a.when === 'now') a.when = 'earlier'; });
    if (state.view !== 'alerts') state.unread++;
    toast({ title, body, id });
  }
  function placeAlert(a, onOpen) {
    state.alerts.unshift({ ...a, when: 'now' });
    state.alerts.slice(1).forEach((x) => { if (x.when === 'now') x.when = 'earlier'; });
    if (state.view !== 'alerts') state.unread++;
    toast({ title: a.title, body: a.body, onOpen });
    render();
  }
  function followPark(id) {
    const park = PARKS.find((x) => x.id === id);
    if (state.parksFollowed.has(id)) { state.parksFollowed.delete(id); openPark(id); render(); return; }
    state.parksFollowed.add(id); openPark(id); render();
    toast({ info: true, title: `Following ${park.name}`, body: "On days trucks are here, you'll get tonight's lineup at 4 PM. Here's what that looks like…" });
    setTimeout(() => {
      if (!state.parksFollowed.has(id)) return;
      const { now, later } = atPark(park);
      const names = [...now, ...later].map(({ t }) => t.name);
      const pick = names.length ? names : trucks.slice(0, 5).map((t) => t.name);
      placeAlert({ park: id, title: `Tonight at ${park.name}`, body: pick.length <= 2 ? pick.join(' and ') : `${pick[0]}, ${pick[1]} + ${pick.length - 2} more` }, () => openPark(id));
    }, 4500);
  }
  function toggleGoing() {
    state.going = !state.going; openEvent(); render();
    if (!state.going) return;
    toast({ info: true, title: "You're going", body: "We'll remind you the morning of, and tell you when more trucks join. Here's the reminder…" });
    setTimeout(() => {
      if (state.going) placeAlert({ event: 1, title: `Today: ${EVENT.name}`, body: `6:00 PM · ${EVENT.where} · ${EVENT.lineup.length} trucks` }, openEvent);
    }, 4500);
  }
  function follow(id) {
    const t = trucks.find((x) => x.id === id);
    if (state.following.has(id)) { state.following.delete(id); render(); return; }
    state.following.add(id);
    toast({ info: true, title: `Following ${t.name}`, body: "You'll get an alert when they pull up. Watch for it in a few seconds…" });
    render();
    if (state.surprised.has(id)) return;
    state.surprised.add(id);
    setTimeout(() => {
      if (!state.following.has(id)) return;
      const st = statusOf(t);
      if (st.kind === 'open') {
        pushAlert(id, `${t.name} posted a special`, SPECIALS[id % SPECIALS.length]);
      } else {
        // Pretend they just parked at their next (or usual) spot.
        const stop = st.stop || t.stops[0];
        state.forced.set(id, { kind: 'open', until: Math.min(state.time.min + 180, 23 * 60 + 30), stop });
        pushAlert(id, `${t.name} just pulled up`, `${stop.place} · ${miles(YOU, stop.at).toFixed(1)} mi away`);
      }
      render();
    }, 4500);
  }

  // ---- events ----
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-view],[data-time],[data-chip],[data-truck],[data-close],[data-follow],[data-owner],[data-until],[data-sold],[data-stat-sec],[data-stat-days],[data-cater],[data-park],[data-event],[data-suggest],[data-pfollow],[data-going],[data-rreport],[data-rblock]');
    if (!el) return;
    if (el.dataset.rreport) { e.preventDefault(); toast({ info: true, title: 'Report a review', body: "In the app, pick a reason (off-topic, hateful, fake, personal info). The Trukbite team checks every report and removes reviews that break the rules." }); return; }
    if (el.dataset.rblock) { e.preventDefault(); blockedWho.add(el.dataset.rblock); renderTruck(); toast({ info: true, title: `You blocked ${el.dataset.rblock}`, body: "You won't see their reviews anymore, and they aren't told. Unblock anytime in Profile → Blocked people." }); return; }
    if (el.dataset.view) { state.view = el.dataset.view; if (state.view === 'alerts') state.unread = 0; closeTruck(); render(); panel.parentElement.scrollTop = 0; return; }
    if (el.dataset.time) { state.time = TIMES.find((t) => t.id === el.dataset.time); state.forced.clear(); render(); return; }
    if (el.dataset.chip !== undefined) { state.chip = el.dataset.chip; render(); return; }
    if (el.dataset.truck !== undefined) { openTruck(Number(el.dataset.truck)); return; }
    if (el.hasAttribute('data-close')) { closeTruck(); return; }
    if (el.dataset.follow) { follow(Number(el.dataset.follow)); return; }
    if (el.dataset.until) { state.owner.until = Number(el.dataset.until); render(); return; }
    if (el.dataset.pfollow) { followPark(el.dataset.pfollow); return; }
    if (el.dataset.going) { toggleGoing(); return; }
    if (el.dataset.park) { openPark(el.dataset.park); return; }
    if (el.dataset.event) { openEvent(); return; }
    if (el.dataset.suggest) { toast({ info: true, title: 'Suggest a spot', body: "In the app, anyone signed in can suggest a truck park or event. The Trukbite team checks it, and you get an alert when it's live." }); return; }
    if (el.dataset.cater === 'open') { state.cater = state.open; renderTruck(); return; }
    if (el.dataset.cater === 'send') {
      const filled = ['c-date', 'c-people', 'c-where', 'c-name'].every((id) => (document.getElementById(id)?.value || '').trim());
      if (!filled) { toast({ info: true, title: 'Fill in all four', body: 'Date, headcount, where, and your name and phone.' }); return; }
      const t = all().find((x) => x.id === state.open);
      state.cater = null; renderTruck();
      toast({ info: true, title: `Request sent to ${t.name}`, body: "In the real app, the truck gets an alert with your event details and contact info, and reaches out to you directly. (Demo: nothing was sent.)" });
      return;
    }
    if (el.dataset.statSec) { state.owner.statSec = el.dataset.statSec; render(); return; }
    if (el.dataset.statDays) { state.owner.statDays = Number(el.dataset.statDays); render(); return; }
    if (el.dataset.sold) { const i = Number(el.dataset.sold), s = state.owner.sold; s.has(i) ? s.delete(i) : s.add(i); render(); return; }
    const o = state.owner;
    if (el.dataset.owner === 'open') {
      o.open = true; render();
      map.flyTo(ME.stops[0].at, 14, { duration: .8 });
      setTimeout(() => toast({ title: 'Your Truck just pulled up', body: `${ME.stops[0].place} · open until ${clock(o.until)}`, id: 0 }), 900);
      setTimeout(() => toast({ info: true, title: `Alert sent to ${o.followers} followers`, body: 'That notification is what your followers just got on their phones. You\'re on the map now.' }), 1600);
    } else if (el.dataset.owner === 'close') {
      o.open = false; o.sold.clear(); render();
      toast({ info: true, title: 'Closed for today', body: 'Your pin is off the map, and your sold-out switches reset for tomorrow.' });
    } else if (el.dataset.owner === 'widget') {
      toast({ info: true, title: 'Your schedule, on your website', body: "In the app, this opens a page with a live preview (light or dark) and the code to copy into Wix, Squarespace or WordPress. When you change your schedule, your website updates too." });
    } else if (el.dataset.owner === 'calendar') {
      toast({ info: true, title: 'Your calendar, on your schedule', body: "In the app, you paste your Google Calendar's secret link once. Each event becomes a stop at your saved spot or truck park, and Trukbite asks once about any new address. Move or delete an event and your Trukbite schedule follows." });
    } else if (el.dataset.owner === 'billing') {
      toast({ info: true, title: 'Your plan, your call', body: "In the app, More → Plan & billing shows your plan. Go Pro for $14.99/month or $149/year (founding trucks: $7.49/month or $74.50/year for life). Payments are handled by Stripe, and you can change your card, switch monthly/yearly or cancel anytime." });
    } else if (el.dataset.owner === 'call') {
      toast({ info: true, title: 'Reach out in one tap', body: "In the app, Call and Text open your phone with their number (Text starts a message for you). Then mark the request Contacted or Booked." });
    } else if (el.dataset.owner === 'share') {
      toast({ info: true, title: 'Share your truck page', body: "In the app, this opens your phone's share sheet so you can text the link or paste it in your Instagram bio. Customers see your menu, schedule and whether you're open, no app needed." });
    } else if (el.dataset.owner === 'special') {
      const v = (document.getElementById('special').value || '').trim();
      if (!v) { toast({ info: true, title: 'Type a special first', body: 'For example: "$2 off quesabirria until 8".' }); return; }
      o.special = v; render();
      toast({ title: 'Your Truck posted a special', body: v, id: 0 });
      setTimeout(() => toast({ info: true, title: 'Sent to followers who turned on specials', body: 'It also shows on your truck page for 24 hours. Specials are part of Pro.' }), 700);
    }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'q') { state.q = e.target.value; if (state.q && state.chip === 'open') state.chip = ''; render(); }
    if (e.target.id === 'special') state.owner.special = e.target.value;
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'until') { state.owner.until = Number(e.target.value); render(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open !== null) closeTruck(); });

  render();
})();
</script>
</body>
</html>
